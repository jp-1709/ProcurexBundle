<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProcureX</title>
    {% if procurex_css %}
    <link rel="stylesheet" href="{{ procurex_css }}">
    {% endif %}
    <style>
        /* Reset Frappe styles so the React app owns the full viewport */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: inherit;
            background: inherit;
        }
        #root {
            height: 100vh;
            width: 100vw;
        }
        /* Hide all Frappe layout chrome */
        .navbar, .sidebar, .page-head, .page-content, .page-footer, .frappe-control {
            display: none !important;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script>
        // Expose CSRF token so the React app can include it in API calls
        window.csrf_token = "{{ csrf_token }}";
    </script>
    {% if procurex_js %}
    <script src="{{ procurex_js }}" type="module"></script>
    {% endif %}
</body>
</html>
