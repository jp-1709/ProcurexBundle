[project]
name = "procurex_bundle"
authors = [
    { name = "Quantbit Technologies Pvt Ltd", email = "contact@quantbit.io" }
]
description = "ProcureX Bundle — installs ProcureX frontend + backend (procurex) together"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # procurex is declared as required_apps in hooks.py;
    # Frappe handles its installation order automatically.
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

# ---------------------------------------------------------------------------
# Apt dependencies installed on Frappe Cloud hosting
# ---------------------------------------------------------------------------
[deploy.dependencies.apt]
packages = ["git", "nodejs", "npm"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B", "RUF"]
ignore = [
    "E501", "E741", "F401", "F403", "F405",
    "UP030", "UP031", "UP032", "UP037", "UP040",
    "B904", "W191",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
docstring-code-format = true
